name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: The browser engine answers the same as the server
        run: node scripts/astro-vectors.mjs
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-sky ./cmd/pocket-sky
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/psky DEMO_DATA=true AUTH_MODE=none ./pocket-sky &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/overview | grep -q '"places"'
          curl -fsS http://localhost:8080/api/v1/locations | grep -q 'Bjela'
          curl -fsS http://localhost:8080/api/v1/tonight | grep -q '"planets"'
          curl -fsS http://localhost:8080/api/v1/events | grep -q '"events"'
          curl -fsS http://localhost:8080/api/v1/observations | grep -q '"objects"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-sky:pr
